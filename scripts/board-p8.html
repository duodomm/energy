<style>.hm-cell{transform-box:fill-box;transform-origin:center}</style>
<script>
(function(){
"use strict";
var DPR=Math.min(window.devicePixelRatio||1,2);
function onVisible(el,cb){var o=new IntersectionObserver(function(es){es.forEach(function(e){cb(e.isIntersecting)})},{threshold:.15});o.observe(el);return o}
function onceVisible(el,cb){var o=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){cb();o.disconnect()}})},{threshold:.3});o.observe(el)}
function fmt(n){return Math.round(n).toLocaleString('ru-RU')}
var easeOut=function(p){return 1-Math.pow(1-p,3)};

/* ---------- метры концепций ---------- */
var mo=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.style.width=e.target.dataset.w+'%';mo.unobserve(e.target)}})},{threshold:.4});
document.querySelectorAll('.meter .bar i[data-w]').forEach(function(i){mo.observe(i)});

/* ---------- 02 ЭНЕРГОПОТОК ---------- */
(function(){
  var cv=document.getElementById('c2cv'); if(!cv)return;
  var ctx=cv.getContext('2d'),W=0,H=0,run=false,raf=null;
  var parts=[],charge=61,day=true,t0=performance.now();
  function resize(){var r=cv.parentElement.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
  resize();window.addEventListener('resize',resize);
  function nodes(){return{s:{x:.13*W,y:.16*H},p:{x:.15*W,y:.66*H},i:{x:.46*W,y:.52*H},b:{x:.42*W,y:.88*H},h:{x:.86*W,y:.44*H}}}
  function segs(){var n=nodes();return[
    {a:n.s,b:n.p,cp:{x:.30*W,y:.42*H},col:'255,176,32',next:[1]},
    {a:n.p,b:n.i,cp:{x:.30*W,y:.75*H},col:'255,140,40',next:[2,3]},
    {a:n.i,b:n.h,cp:{x:.66*W,y:.38*H},col:'255,120,20',next:[-1]},
    {a:n.i,b:n.b,cp:{x:.48*W,y:.74*H},col:'255,176,32',next:[-2]},
    {a:n.b,b:n.h,cp:{x:.66*W,y:.78*H},col:'45,212,168',next:[-1]}]}
  function qp(s,t){var u=1-t;return{x:u*u*s.a.x+2*u*t*s.cp.x+t*t*s.b.x,y:u*u*s.a.y+2*u*t*s.cp.y+t*t*s.b.y}}
  function spawn(){var S=segs();parts.push({seg:0,t:Math.random()*.05,sp:.004+Math.random()*.004,r:1.8+Math.random()*1.4,drift:Math.random()*6.28})}
  function nodeIcons(n,S){
    ctx.lineWidth=1.2;
    // солнце
    var g=ctx.createRadialGradient(n.s.x,n.s.y,2,n.s.x,n.s.y,30);
    g.addColorStop(0,'rgba(255,200,80,.95)');g.addColorStop(.4,'rgba(255,176,32,.55)');g.addColorStop(1,'rgba(255,176,32,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(n.s.x,n.s.y,30,0,6.283);ctx.fill();
    ctx.strokeStyle='rgba(255,176,32,.8)';ctx.beginPath();ctx.arc(n.s.x,n.s.y,13,0,6.283);ctx.stroke();
    for(var k=0;k<8;k++){var a=k/8*6.283+.3;ctx.beginPath();ctx.moveTo(n.s.x+Math.cos(a)*17,n.s.y+Math.sin(a)*17);ctx.lineTo(n.s.x+Math.cos(a)*22,n.s.y+Math.sin(a)*22);ctx.stroke()}
    // панели
    ctx.save();ctx.translate(n.p.x,n.p.y);ctx.rotate(-.35);
    for(var q=0;q<3;q++){ctx.fillStyle=q%2?'#1a2f4d':'#22385e';ctx.strokeStyle='#3f6fb5';
      ctx.beginPath();ctx.rect(-34+q*24,-16,20,30);ctx.fill();ctx.stroke()}
    ctx.restore();
    // инвертор
    ctx.fillStyle='#141b28';ctx.strokeStyle='#41506b';ctx.beginPath();ctx.rect(n.i.x-13,n.i.y-15,26,30);ctx.fill();ctx.stroke();
    ctx.strokeStyle='rgba(110,168,255,.6)';ctx.beginPath();ctx.moveTo(n.i.x-7,n.i.y+4);ctx.lineTo(n.i.x-2,n.i.y-6);ctx.lineTo(n.i.x+3,n.i.y+4);ctx.stroke();
    // АКБ
    ctx.fillStyle='#101724';ctx.strokeStyle='#2dd4a8aa';ctx.beginPath();ctx.rect(n.b.x-16,n.b.y-13,32,26);ctx.fill();ctx.stroke();
    var bh=20*Math.max(.06,charge/100);ctx.fillStyle='rgba(45,212,168,.75)';ctx.fillRect(n.b.x-12,n.b.y+10-bh,24,bh);
    // дом
    ctx.strokeStyle='#5b6578';ctx.fillStyle='#151d29';ctx.beginPath();
    ctx.moveTo(n.h.x-20,n.h.y+14);ctx.lineTo(n.h.x-20,n.h.y-2);ctx.lineTo(n.h.x,n.h.y-16);ctx.lineTo(n.h.x+20,n.h.y-2);ctx.lineTo(n.h.x+20,n.h.y+14);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.fillStyle=day?'#ffd27a':'#5b8def';ctx.fillRect(n.h.x-6,n.h.y+1,9,9);
    // подписи
    ctx.font='10px ui-monospace,Menlo,monospace';ctx.fillStyle='#5b6578';
    ctx.fillText('СОЛНЦЕ',n.s.x-22,n.s.y+44);ctx.fillText('ПАНЕЛИ 10 кВт',n.p.x-40,n.p.y+30);
    ctx.fillText('ИНВЕРТОР',n.i.x-33,n.i.y-21);ctx.fillText('АКБ '+Math.round(charge)+'%',n.b.x-24,n.b.y+30);
    ctx.fillText('ДОМ',n.h.x-14,n.h.y+30);
    // пути
    ctx.setLineDash([3,5]);ctx.strokeStyle='rgba(255,176,32,.16)';ctx.lineWidth=1;
    S.forEach(function(s){ctx.beginPath();ctx.moveTo(s.a.x,s.a.y);ctx.quadraticCurveTo(s.cp.x,s.cp.y,s.b.x,s.b.y);ctx.stroke()});
    ctx.setLineDash([]);
  }
  function frame(now){
    if(!run){raf=null;return}
    ctx.clearRect(0,0,W,H);
    var S=segs(),n=nodes();
    // дневной цикл
    var cyc=(now-t0)/9000%1; var daylight=cyc<.68;
    if(daylight!==day){day=daylight}
    if(daylight&&parts.length<110&&Math.random()<.5)spawn();
    if(daylight&&Math.random()<.3){charge=Math.min(100,charge+.08)}
    if(!daylight){charge=Math.max(8,charge-.15);if(parts.length<110&&Math.random()<.4)parts.push({seg:4,t:Math.random()*.1,sp:.005+Math.random()*.004,r:2,drift:Math.random()*6.28})}
    nodeIcons(n,S);
    // частицы
    for(var i=parts.length-1;i>=0;i--){var p=parts[i];p.t+=p.sp;
      var s=S[p.seg];if(p.t>=1){var nx=s.next[0];
        if(nx===-1){parts.splice(i,1);continue}
        if(nx===-2){charge=Math.min(100,charge+1.4);parts.splice(i,1);continue}
        if(s.next.length>1)nx=s.next[Math.random()<.6?0:1];
        p.seg=nx;p.t=0;continue}
      var pos=qp(s,p.t),d2=p.drift+now*.002;
      ctx.save();ctx.shadowColor='rgba('+s.col+',.9)';ctx.shadowBlur=9;
      ctx.fillStyle='rgba('+s.col+','+(daylight||p.seg===4?.95:.8)+')';
      ctx.beginPath();ctx.arc(pos.x+Math.cos(d2)*1.5,pos.y+Math.sin(d2)*1.5,p.r,0,6.283);ctx.fill();ctx.restore();
    }
    // KPI
    var pw=(3.1+.7*Math.sin(now/1800))*(daylight?1:.15);
    document.getElementById('c2kpi').textContent=pw.toFixed(1).replace('.',',')+' кВт';
    document.getElementById('c2bat').textContent=Math.round(charge)+'%';
    document.getElementById('c2mode').innerHTML=(daylight?'день<br><b>заряд АКБ</b>':'вечер<br><b style="color:#6ea8ff">разряд АКБ</b>');
    raf=requestAnimationFrame(frame);
  }
  onVisible(cv.parentElement,function(v){run=v;if(v&&!raf)raf=requestAnimationFrame(frame)});
})();

/* ---------- 03 ТЕЛЕМЕТРИЯ ---------- */
(function(){
  var cv=document.getElementById('c3cv'); if(!cv)return;
  var ctx=cv.getContext('2d'),W=0,H=0,vis=false,prog=0,last=0;
  var hours=[],k=0;for(k=0;k<=48;k++){var h=k/2;hours.push(Math.max(0,6.1*Math.exp(-Math.pow(h-13.2,2)/16)+(h>5&&h<21?Math.random()*.2:0)))}
  var gen=3.42,akb=78,eco=214;
  function resize(){var r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);draw(performance.now())}
  function draw(now){
    ctx.clearRect(0,0,W,H);
    var pad={l:26,r:8,t:6,b:16},w=W-pad.l-pad.r,h=H-pad.t-pad.b;
    ctx.strokeStyle='#1a2634';ctx.setLineDash([3,4]);ctx.lineWidth=1;
    [0,3,6].forEach(function(v){var y=pad.t+h-(v/7)*h;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke();
      ctx.setLineDash([]);ctx.font='8px ui-monospace';ctx.fillStyle='#5b6b7d';ctx.fillText(v,pad.l-14,y+3);ctx.setLineDash([3,4])});
    ctx.setLineDash([]);
    ['00','06','12','18','24'].forEach(function(lb,i){ctx.fillStyle='#5b6b7d';ctx.fillText(lb,pad.l+(w*i/4)-6,H-4)});
    var n=Math.max(2,Math.floor(48*Math.min(1,prog)));
    ctx.beginPath();
    for(var i=0;i<=n;i++){var x=pad.l+w*i/48,y=pad.t+h-(hours[i]/7)*h;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}
    ctx.strokeStyle='#ffb020';ctx.lineWidth=1.8;ctx.stroke();
    ctx.lineTo(pad.l+w*n,pad.t+h);ctx.lineTo(pad.l,pad.t+h);ctx.closePath();
    var g=ctx.createLinearGradient(0,pad.t,0,pad.t+h);g.addColorStop(0,'rgba(255,176,32,.30)');g.addColorStop(1,'rgba(255,176,32,0)');
    ctx.fillStyle=g;ctx.fill();
    if(prog>=1){var lx=pad.l+w,ly=pad.t+h-(hours[48]/7)*h,pu=.5+.5*Math.sin(now/300);
      ctx.fillStyle='rgba(51,255,153,'+(.5+pu*.4)+')';ctx.beginPath();ctx.arc(lx-2,ly,3+pu*1.5,0,6.283);ctx.fill()}
  }
  resize();window.addEventListener('resize',resize);
  function tick(now){if(vis){if(prog<1)prog+=.014;draw(now)}requestAnimationFrame(tick)}
  requestAnimationFrame(tick);
  onVisible(cv,function(v){vis=v});
  setInterval(function(){if(!vis)return;
    gen=Math.max(.2,Math.min(6.4,gen+(Math.random()-.5)*.7));
    akb=Math.max(18,Math.min(96,akb+(Math.random()-.45)*1.6));eco+=Math.round(Math.random()*7);
    document.getElementById('c3gen').textContent=gen.toFixed(2).replace('.',',');
    document.getElementById('c3akb').textContent=Math.round(akb);
    document.getElementById('c3eco').textContent=eco;
  },1600);
  var msgs=[['ИНВЕРТОР','режим MPPT · КПД 96,8%','ok'],['СЕТЬ','замер частоты 50,02 Гц','ok'],['АКБ','баланс ячеек Δ 18 мВ','ok'],['ТАРИФ','ночь 2,31 ₽ до 07:00','wr'],['ИНВЕРТОР','пик дня 6,1 кВт в 11:40','ok'],['АКБ','DoD 22% — норма','ok'],['ЭКСПОРТ','+4,2 кВт·ч в сеть','ok'],['ЩИТ','AVR: стабилизация 229 В','ok']];
  var log=document.getElementById('c3log'),mi=0;
  function addLog(){if(!vis||!log)return;var m=msgs[mi++%msgs.length],d=new Date();
    var div=document.createElement('div');
    div.innerHTML='<span class="t">'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+'</span> · '+m[0]+' · <span class="'+(m[2]==='ok'?'ok':'wr')+'">'+m[1]+'</span>';
    log.appendChild(div);while(log.children.length>4)log.removeChild(log.firstChild)}
  for(var j=0;j<3;j++)addLog();
  setInterval(addLog,2400);
})();

/* ---------- 04 КОНФИГУРАТОР ---------- */
(function(){
  var svg=document.getElementById('c4svg'); if(!svg)return;
  var NS='http://www.w3.org/2000/svg',g=document.getElementById('c4panels');
  var rows=[{y:155,n:8},{y:129,n:6},{y:103,n:3}],pw=28,phh=20,gap=5,panels=[];
  rows.forEach(function(r){var w=r.n*pw+(r.n-1)*gap,x0=290-w/2;
    for(var i=0;i<r.n;i++){var rect=document.createElementNS(NS,'rect');
      rect.setAttribute('x',x0+i*(pw+gap));rect.setAttribute('y',r.y);rect.setAttribute('width',pw);rect.setAttribute('height',phh);rect.setAttribute('rx',1.5);
      rect.setAttribute('class','panel');g.appendChild(rect);panels.push(rect)}});
  var range=document.getElementById('c4range'),akb=document.getElementById('c4akb'),inv=document.getElementById('c4inv');
  var battG=document.getElementById('c4batt'),bfill=document.getElementById('c4bfill');
  var state={akb:false,inv:false};
  [akb,inv].forEach(function(t,key){t.addEventListener('click',function(){
    state[key?'inv':'akb']=!state[key?'inv':'akb'];t.classList.toggle('on');update()})});
  range.addEventListener('input',update);
  function update(){
    var kw=parseFloat(range.value),n=Math.round(kw*2),shown=Math.min(n,17);
    range.style.setProperty('--p',((kw-2)/8*100)+'%');
    panels.forEach(function(p,i){p.classList.toggle('on',i<shown);p.classList.toggle('hot',i<shown&&shown===17)});
    document.getElementById('c4kw').textContent=('0'+kw.toFixed(1)).replace('0','').replace(',0','');
    document.getElementById('c4kw').textContent=kw%1?kw.toFixed(1).replace('.',','):kw;
    document.getElementById('c4ph').textContent=n;document.getElementById('c4pn').textContent=shown+(n>17?'+':'');
    document.getElementById('c4m2').textContent=fmt(kw*4.8);
    document.getElementById('c4gen').textContent=fmt(kw*980);
    document.getElementById('c4cov').textContent=Math.min(96,Math.round(kw*13.6));
    battG.style.opacity=state.akb?1:0;
    if(state.akb){bfill.setAttribute('height','12.5');bfill.setAttribute('y','248.5')}
    var price=kw*93+(state.akb?118:0)+(state.inv?42:0);
    document.getElementById('c4price').textContent=fmt(price*1000)+' ₽';
    document.getElementById('c4sub').textContent=fmt(kw*4.8)+' м² кровли · '+fmt(kw*980)+' кВт·ч/год'+(n>17?' · +каркас на участке':(state.akb?' · резерв 12 ч':''));
  }
  update();
})();

/* ---------- 06 ИЗОИНТЕРФЕЙС ---------- */
(function(){
  var dot=document.getElementById('c6dot'); if(!dot)return;
  var ray=document.getElementById('c6ray'),tl=document.getElementById('c6time'),svgSun=document.getElementById('c6sun');
  var P0={x:70,y:200},C={x:300,y:40},P2={x:530,y:200},t=0,vis=false,last=0;
  function qp(tt){var u=1-tt;return{x:u*u*P0.x+2*u*tt*C.x+tt*tt*P2.x,y:u*u*P0.y+2*u*tt*C.y+tt*tt*P2.y}}
  function loop(now){if(vis){if(!last)last=now;var dt=(now-last)/1000;last=now;t+=dt/12;if(t>1){t=0}
      var p=qp(t);dot.setAttribute('cx',p.x);dot.setAttribute('cy',p.y);
      ray.setAttribute('x1',p.x);ray.setAttribute('y1',p.y);ray.setAttribute('x2',300);ray.setAttribute('y2',190);
      var hour=6+t*12,hh=Math.floor(hour),mm=Math.floor((hour-hh)*60);
      var alt=Math.max(0,Math.round((200-p.y)*.42));
      tl.textContent=String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0')+' · высота '+alt+'°'}
    requestAnimationFrame(loop)}
  requestAnimationFrame(loop);
  onVisible(svgSun,function(v){vis=v;if(!v)last=0});
  // тепловая карта
  var heat=document.getElementById('c6heat'); if(!heat)return;
  var NS='http://www.w3.org/2000/svg';
  var months=['Я','Ф','М','А','М','И','И','А','С','О','Н','Д'];
  var psh=[1.2,2.1,3.4,4.6,5.8,6.3,6.1,5.2,3.9,2.4,1.4,1.0];
  for(var m=0;m<12;m++){
    for(var h=5;h<=21;h++){
      var v=psh[m]*Math.exp(-Math.pow(h-13,2)/16),norm=v/6.5;
      var r=document.createElementNS(NS,'rect');
      r.setAttribute('x',30+m*45+2);r.setAttribute('y',16+(h-5)*7.5);
      r.setAttribute('width',41);r.setAttribute('height',6);
      r.setAttribute('fill','rgba(255,176,32,'+(.06+.94*norm).toFixed(2)+')');
      r.setAttribute('class','hm-cell');r.style.setProperty('--d',((m*17+h-5)*6)+'ms');
      r.setAttribute('title',months[m]+': '+h+':00 — '+(v*.55).toFixed(2)+' кВт·ч');
      heat.appendChild(r);
    }
    var tx=document.createElementNS(NS,'text');tx.setAttribute('x',30+m*45+22);tx.setAttribute('y',162);
    tx.setAttribute('class','axis');tx.setAttribute('text-anchor','middle');tx.textContent=months[m];heat.appendChild(tx);
  }
  [6,9,12,15,18].forEach(function(hb){var ty=document.createElementNS(NS,'text');
    ty.setAttribute('x',24);ty.setAttribute('y',20+(hb-5)*7.5+5);ty.setAttribute('class','axis');ty.textContent=hb;heat.appendChild(ty)});
})();

/* ---------- 07 3D-УСАДЬБА ---------- */
(function(){
  var cv=document.getElementById('c7cv'); if(!cv)return;
  var ctx=cv.getContext('2d'),W=0,H=0,vis=false,yaw=3.64,pitch=.44,drag=false,lx=0,ly=0,idle=0;
  function resize(){var r=cv.parentElement.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
  resize();window.addEventListener('resize',resize);
  // геометрия: дом 4×5 м, конёк вдоль X, южный скат с панелями
  function P(x,y,z){return{x:x,y:y,z:z}}
  function quad(pts,base,nx,ny,nz,stroke){return{pts:pts,base:base,n:{x:nx,y:ny,z:nz},stroke:stroke}}
  var L={x:.28,y:.85,z:.45},ln=Math.sqrt(L.x*L.x+L.y*L.y+L.z*L.z);L={x:L.x/ln,y:L.y/ln,z:L.z/ln};
  var quads=[];
  var wall='#3c4d68',wallD='#2b384e',roof='#202d45',gable='#2a3648';
  quads.push(quad([P(-2,0,2.5),P(2,0,2.5),P(2,2.6,2.5),P(-2,2.6,2.5)],wall,0,0,1));            // юг стена
  quads.push(quad([P(-2,0,-2.5),P(-2,2.6,-2.5),P(2,2.6,-2.5),P(2,0,-2.5)],wallD,0,0,-1));        // север
  quads.push(quad([P(2,0,2.5),P(2,0,-2.5),P(2,2.6,-2.5),P(2,2.6,2.5)],'#33425c',1,0,0));         // восток
  quads.push(quad([P(-2,0,-2.5),P(-2,0,2.5),P(-2,2.6,2.5),P(-2,2.6,-2.5)],wallD,-1,0,0));        // запад
  quads.push(quad([P(-2,2.6,2.5),P(2,2.6,2.5),P(2,4,0),P(-2,4,0)],roof,0,.87,.49));              // южный скат
  quads.push(quad([P(-2,2.6,-2.5),P(-2,4,0),P(2,4,0),P(2,2.6,-2.5)],'#182338',0,.87,-.49));      // северный скат
  quads.push({pts:[P(2,2.6,2.5),P(2,4,0),P(2,2.6,-2.5)],base:gable,n:{x:1,y:0,z:0}});
  quads.push({pts:[P(-2,2.6,-2.5),P(-2,4,0),P(-2,2.6,2.5)],base:gable,n:{x:-1,y:0,z:0}});
  quads.push(quad([P(.7,0,2.51),P(1.5,0,2.51),P(1.5,2.05,2.51),P(.7,2.05,2.51)],'#151d2c',0,0,1)); // дверь
  // панели на южном скате: 4 колонки × 2 ряда
  var sD={x:0,y:.4885,z:-.8725},nrm={x:0,y:.8725,z:.4885};
  function onSlope(u,v,off){return P(u,2.6+sD.y*v+ nrm.y*off,2.5+sD.z*v+nrm.z*off)}
  var pcs=[];
  for(var c=0;c<4;c++)for(var rw=0;rw<2;rw++){
    var u=-1.55+c*.79+.395,v=.5+rw*1.25,hw=.33,hv=.55,off=.12;
    pcs.push(quad([onSlope(u-hw,v,off),onSlope(u+hw,v,off),onSlope(u+hw,v+hv,off),onSlope(u-hw,v+hv,off)],'#3563b8',nrm.x,nrm.y,nrm.z,'#9cc1ff'));
  }
  function project(p){var cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
    var x=p.x*cy+p.z*sy,z=-p.x*sy+p.z*cy,y=p.y-1.8;
    var y2=y*cp+z*sp,z2=z*cp-y*sp;
    var f=Math.min(W,H)*1.5,dz=z2+9;
    return{x:W/2+f*x/dz,y:H*.52-f*y2/dz,z:z2}}
  function shade(hex,br){var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
    var k=.58+br*.92;
    return 'rgb('+Math.min(255,Math.round(r*k))+','+Math.min(255,Math.round(g*k))+','+Math.min(255,Math.round(b*k))+')'}
  function draw(){
    ctx.clearRect(0,0,W,H);
    // солнце
    var sx=W*.82,sy=H*.17,sg=ctx.createRadialGradient(sx,sy,2,sx,sy,62);
    sg.addColorStop(0,'rgba(255,222,140,1)');sg.addColorStop(.28,'rgba(255,176,32,.75)');sg.addColorStop(.62,'rgba(255,140,20,.22)');sg.addColorStop(1,'rgba(255,176,32,0)');
    ctx.fillStyle=sg;ctx.beginPath();ctx.arc(sx,sy,62,0,6.283);ctx.fill();
    ctx.strokeStyle='rgba(255,196,80,.5)';ctx.lineWidth=1.2;
    for(var k=0;k<8;k++){var a=k/8*6.283;ctx.beginPath();ctx.moveTo(sx+Math.cos(a)*44,sy+Math.sin(a)*44);ctx.lineTo(sx+Math.cos(a)*54,sy+Math.sin(a)*54);ctx.stroke()}
    // земля-сетка
    ctx.strokeStyle='#242f42';ctx.lineWidth=1;
    for(var gi=-4;gi<=4;gi++){var a=project(P(gi,0,-4)),b=project(P(gi,0,4));
      ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
      var c2=project(P(-4,0,gi)),d2=project(P(4,0,gi));
      ctx.beginPath();ctx.moveTo(c2.x,c2.y);ctx.lineTo(d2.x,d2.y);ctx.stroke()}
    var all=quads.concat(pcs).map(function(q){return{q:q,z:q.pts.reduce(function(s,p){var pr=project(p);return s+pr.z},0)/q.pts.length}});
    all.sort(function(a,b){return b.z-a.z});
    // тень под домом
    var sh=[P(-2.7,.015,-2.9),P(2.9,.015,-2.9),P(2.9,.015,2.9),P(-2.7,.015,2.9)].map(project);
    ctx.beginPath();ctx.moveTo(sh[0].x,sh[0].y);for(var si=1;si<4;si++)ctx.lineTo(sh[si].x,sh[si].y);ctx.closePath();
    ctx.fillStyle='rgba(3,6,10,.5)';ctx.fill();
    all.forEach(function(o){var q=o.q,ps=q.pts.map(project);
      var br=Math.max(0,q.n.x*L.x+q.n.y*L.y+q.n.z*L.z);
      ctx.beginPath();ctx.moveTo(ps[0].x,ps[0].y);
      for(var i=1;i<ps.length;i++)ctx.lineTo(ps[i].x,ps[i].y);
      ctx.closePath();
      ctx.fillStyle=shade(q.base,br);ctx.fill();
      if(q.stroke){ctx.strokeStyle=q.stroke;ctx.lineWidth=1.4;ctx.stroke()}
      else{ctx.strokeStyle='rgba(255,255,255,.14)';ctx.lineWidth=1;ctx.stroke()}
      if(br>.7&&q.base==='#3563b8'){ctx.strokeStyle='rgba(255,196,90,.85)';ctx.lineWidth=1.8;ctx.stroke()}
    });
    var deg=Math.round(yaw*57.3)%360;
    document.getElementById('c7yaw').textContent='YAW '+deg+'°';
  }
  function loop(){if(vis){if(!drag){idle++;if(idle>240)yaw+=.0012}draw()}requestAnimationFrame(loop)}
  requestAnimationFrame(loop);
  onVisible(cv,function(v){vis=v});
  function down(x,y){drag=true;lx=x;ly=y;idle=0}
  function move(x,y){if(!drag)return;yaw+=(x-lx)*.008;pitch=Math.max(.18,Math.min(1.1,pitch-(y-ly)*.006));lx=x;ly=y;idle=0}
  cv.addEventListener('mousedown',function(e){down(e.offsetX,e.offsetY)});
  window.addEventListener('mousemove',function(e){var r=cv.getBoundingClientRect();move(e.clientX-r.left,e.clientY-r.top)});
  window.addEventListener('mouseup',function(){drag=false});
  cv.addEventListener('touchstart',function(e){var t=e.touches[0],r=cv.getBoundingClientRect();down(t.clientX-r.left,t.clientY-r.top)},{passive:true});
  cv.addEventListener('touchmove',function(e){var t=e.touches[0],r=cv.getBoundingClientRect();move(t.clientX-r.left,t.clientY-r.top)},{passive:true});
  cv.addEventListener('touchend',function(){drag=false});
})();

/* ---------- 08 ПЛАКАТ count-up ---------- */
(function(){
  var targets={c8n1:1226400,c8n2:14200,c8n3:68,c8n4:9.4,c8n5:58,c8n6:25,c8n7:6000};
  var box=document.querySelector('.c8'); if(!box)return;
  onceVisible(box,function(){
    var t0=performance.now();
    function step(now){var p=Math.min(1,(now-t0)/1300),e=easeOut(p);
      for(var id in targets){var v=targets[id]*e,el=document.getElementById(id);if(!el)continue;
        if(id==='c8n4')el.textContent=v.toFixed(1).replace('.',',');
        else el.textContent=fmt(v)}
      if(p<1)requestAnimationFrame(step)}
    requestAnimationFrame(step)});
})();

/* ---------- 09 ПРИБОРНАЯ ПАНЕЛЬ ---------- */
(function(){
  var svg=document.getElementById('c9ticks'); if(!svg)return;
  var NS='http://www.w3.org/2000/svg';
  for(var v=0;v<=100;v+=10){
    var th=(v*1.8-90)*Math.PI/180,dx=Math.sin(th),dy=-Math.cos(th);
    var ln=document.createElementNS(NS,'line');
    var r1=v%25===0?92:97,r2=106;
    ln.setAttribute('x1',150+dx*r1);ln.setAttribute('y1',145+dy*r1);
    ln.setAttribute('x2',150+dx*r2);ln.setAttribute('y2',145+dy*r2);
    ln.setAttribute('stroke',v>=90?'#d54500':'#8b98ab');ln.setAttribute('stroke-width',v%25===0?2:1);
    svg.appendChild(ln);
    if(v%25===0){var tx=document.createElementNS(NS,'text');
      tx.setAttribute('x',150+dx*80);tx.setAttribute('y',145+dy*80+3);tx.setAttribute('text-anchor','middle');
      tx.setAttribute('style','font:9px ui-monospace;fill:#7b8698');tx.textContent=v;svg.appendChild(tx)}
  }
  var slide=document.getElementById('c9slide'),needle=document.getElementById('c9needle'),arc=document.getElementById('c9arc'),
      val=document.getElementById('c9val'),kwh=document.getElementById('c9kwh');
  function setG(v){
    needle.style.transform='rotate('+(v*1.8-90)+'deg)';
    arc.setAttribute('stroke-dasharray',(v/100*345.6).toFixed(1)+' 400');
    val.textContent=v+'%';
    if(v<20)val.setAttribute('fill','#d54500');else if(v>90)val.setAttribute('fill','#b4832a');else val.setAttribute('fill','#1f8a5f');
    var hrs=v/12,base=16+hrs,hh=Math.floor(base)%24,mm=Math.floor((base-Math.floor(base))*60);
    kwh.textContent=(v/10).toFixed(1).replace('.',',')+' / 10 кВт·ч · до '+String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');
  }
  slide.addEventListener('input',function(){setG(parseInt(this.value,10))});
  setG(78);
  ['c9sw1','c9sw2','c9sw3'].forEach(function(id){var el=document.getElementById(id);
    el.addEventListener('click',function(){el.classList.toggle('on');syncLeds()})});
  function syncLeds(){var on=document.querySelectorAll('.c9-switch.on').length;
    document.querySelectorAll('.c9-led').forEach(function(l,i){l.classList.toggle('on',i<1+on)})}
  syncLeds();
})();

/* ---------- 10 ДВУХРЕЖИМНАЯ ---------- */
(function(){
  var seg=document.getElementById('c10seg'),calc=document.getElementById('c10calc'); if(!seg)return;
  seg.querySelectorAll('button').forEach(function(b){
    b.addEventListener('click',function(){
      seg.querySelectorAll('button').forEach(function(x){x.classList.remove('on')});
      b.classList.add('on');
      calc.classList.toggle('lit',b.dataset.m==='lit');
    })});
})();
})();
