<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>10 концепций оформления — «Альтернативная энергетика РФ» · Итоги экспертной комиссии</title>
<style>
/* ================= BOARD CHROME ================= */
:root{
  --bg:#0e1218; --bg2:#12161d; --card:#161b24; --card2:#1a202b; --line:#262d3a; --line2:#1c222d;
  --fg:#e8eaed; --mut:#8b93a1; --amber:#ffb020; --orange:#ff6a00; --teal:#2dd4a8;
  --blue:#6ea8ff; --violet:#a78bfa; --red:#ef4444; --green:#22c55e;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  --serif:Georgia,"Times New Roman",serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);line-height:1.55;
  background-image:radial-gradient(1200px 500px at 85% -10%,rgba(255,106,0,.07),transparent 60%),
                   radial-gradient(900px 420px at 8% -5%,rgba(255,176,32,.05),transparent 55%),
                   radial-gradient(700px 500px at 50% 115%,rgba(45,212,168,.04),transparent 60%);
  background-attachment:fixed;}
::selection{background:rgba(255,176,32,.3)}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}

/* top nav */
.topnav{position:sticky;top:0;z-index:50;background:rgba(14,18,24,.93);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topnav-in{max-width:1240px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;padding:10px 16px;scrollbar-width:thin}
.topnav-in::-webkit-scrollbar{height:4px}
.topnav a{flex-shrink:0;font-size:12.5px;color:var(--mut);text-decoration:none;border:1px solid var(--line);border-radius:99px;padding:5px 12px;transition:color .15s,border-color .15s;white-space:nowrap}
.topnav a:hover{color:var(--amber);border-color:rgba(255,176,32,.45)}
.topnav a.star{color:var(--amber)}

/* header */
.board-hero{padding:64px 0 40px;border-bottom:1px solid var(--line2)}
.board-hero .kicker{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--amber);border:1px solid rgba(255,176,32,.3);background:rgba(255,176,32,.07);border-radius:99px;padding:6px 14px}
.board-hero h1{font-size:clamp(30px,4.6vw,52px);font-weight:800;line-height:1.08;letter-spacing:-.02em;margin:20px 0 14px;max-width:900px}
.board-hero h1 .grad{background:linear-gradient(100deg,#ffb020 10%,#ff6a00 90%);-webkit-background-clip:text;background-clip:text;color:transparent}
.board-hero .sub{max-width:760px;color:var(--mut);font-size:16px}
.board-hero .meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.board-hero .meta span{font-size:12.5px;color:var(--mut);border:1px solid var(--line);border-radius:8px;padding:5px 11px}
.board-hero .meta b{color:var(--fg);font-weight:600}

/* sections */
.section{padding:52px 0 12px}
.section-title{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.section-title h2{font-size:clamp(22px,3vw,30px);font-weight:750;letter-spacing:-.01em}
.section-title .tag{font-size:13px;color:var(--teal)}
.section-lead{max-width:820px;color:var(--mut);margin:10px 0 26px;font-size:15.5px}

/* commission */
.comm-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px;margin-bottom:30px}
.comm-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.comm-card .role{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber)}
.comm-card .name{font-size:16.5px;font-weight:700;margin:3px 0 2px}
.comm-card .exp{font-size:12.5px;color:var(--mut);line-height:1.45}

.blocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:12px}
.block{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.block h3{font-size:14px;font-weight:700;color:var(--fg);display:flex;gap:8px;align-items:center}
.block h3 .it{font-family:var(--mono);font-size:11px;color:var(--amber);border:1px solid rgba(255,176,32,.35);border-radius:6px;padding:2px 7px;background:rgba(255,176,32,.06)}
.block ul{margin:12px 0 0 2px;list-style:none}
.block li{font-size:13px;color:var(--mut);padding:5px 0 5px 0;border-bottom:1px dashed var(--line2)}
.block li:last-child{border-bottom:none}
.block li b{color:var(--fg);font-weight:600}
.block .out{margin-top:12px;font-size:12.5px;color:var(--teal);background:rgba(45,212,168,.07);border:1px solid rgba(45,212,168,.25);border-radius:9px;padding:9px 11px}

/* diagnosis */
.dx-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:10px;margin-top:6px}
.dx{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.dx .n{font-family:var(--mono);font-size:13px;color:var(--red);border:1px solid rgba(239,68,68,.35);background:rgba(239,68,68,.06);height:26px;min-width:26px;border-radius:7px;display:flex;align-items:center;justify-content:center}
.dx p{font-size:13.5px;color:#c9ced6;line-height:1.45}
.dx p b{color:var(--fg)}

/* principles */
.principles{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-top:26px}
.pr{background:rgba(45,212,168,.05);border:1px solid rgba(45,212,168,.22);border-radius:12px;padding:13px 15px;font-size:13px;color:var(--mut)}
.pr b{color:var(--teal);display:block;margin-bottom:3px;font-size:13.5px}

/* ================= CONCEPT SECTIONS ================= */
.concept{border-top:1px solid var(--line2);padding:54px 0 8px;scroll-margin-top:70px}
.concept-head{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.cnum{font-family:var(--mono);font-size:34px;font-weight:700;color:transparent;-webkit-text-stroke:1.5px rgba(255,176,32,.55);line-height:1}
.concept-head h2{font-size:clamp(21px,2.6vw,28px);font-weight:750;letter-spacing:-.01em}
.ctag{font-size:14px;color:var(--mut);margin-top:3px;max-width:640px}
.badge{margin-left:auto;flex-shrink:0;font-size:12px;font-weight:650;border-radius:99px;padding:6px 13px;border:1px solid;white-space:nowrap}
.badge-green{color:#4ade80;border-color:rgba(74,222,128,.4);background:rgba(34,197,94,.08)}
.badge-amber{color:var(--amber);border-color:rgba(255,176,32,.4);background:rgba(255,176,32,.07)}
.badge-blue{color:var(--blue);border-color:rgba(110,168,255,.4);background:rgba(110,168,255,.07)}
.badge-red{color:#f87171;border-color:rgba(248,113,113,.4);background:rgba(239,68,68,.07)}
.concept-grid{display:grid;grid-template-columns:1.45fr .9fr;gap:16px;margin-top:24px}
@media(max-width:920px){.concept-grid{grid-template-columns:1fr}}

/* demo frame */
.demo{position:relative;background:var(--bg2);border:1px solid var(--line);border-radius:16px;overflow:hidden;min-height:340px}
.demo-hint{position:absolute;left:14px;bottom:12px;z-index:5;font-size:11.5px;color:var(--mut);background:rgba(14,18,24,.75);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:99px;padding:4px 11px;pointer-events:none}

/* spec sheet */
.spec{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.spec h4{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);margin:14px 0 6px}
.spec h4:first-child{margin-top:0}
.spec .val{font-size:13.5px;color:#d5dae1;line-height:1.5}
.spec .val code{font-family:var(--mono);font-size:12px;color:var(--amber);background:rgba(255,176,32,.07);border:1px solid rgba(255,176,32,.18);border-radius:5px;padding:1px 6px}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:6px;font-size:12px;color:#c9ced6;border:1px solid var(--line);border-radius:99px;padding:4px 10px}
.chip i{width:13px;height:13px;border-radius:4px;display:inline-block;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.spec ul{list-style:none;margin-top:2px}
.spec li{font-size:13px;color:#c9ced6;padding:3.5px 0 3.5px 18px;position:relative;line-height:1.4}
.spec li::before{position:absolute;left:2px;top:7px;width:7px;height:7px;border-radius:2px}
.spec li.p::before{content:"";background:var(--teal);transform:rotate(45deg) scale(.8)}
.spec li.c::before{content:"";background:var(--red);border-radius:50%;transform:scale(.8)}
.meters{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.meter span{font-size:11px;color:var(--mut)}
.meter .bar{height:7px;border-radius:99px;background:var(--line2);overflow:hidden;margin:4px 0 2px}
.meter .bar i{display:block;height:100%;border-radius:99px;width:0;transition:width 1.1s cubic-bezier(.22,1,.36,1)}
.meter b{font-family:var(--mono);font-size:11px;color:var(--mut);font-weight:400}
.effort{margin-top:14px;font-size:12.5px;color:var(--mut)}
.effort b{color:var(--amber);font-family:var(--mono)}

/* matrix */
table.matrix{width:100%;border-collapse:collapse;margin-top:18px;font-size:13px}
.matrix th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);padding:10px 12px;border-bottom:1px solid var(--line)}
.matrix td{padding:12px;border-bottom:1px solid var(--line2);vertical-align:middle}
.matrix tr:hover td{background:rgba(255,176,32,.03)}
.matrix .cname{font-weight:650;color:var(--fg);white-space:nowrap}
.matrix .cname .no{font-family:var(--mono);color:var(--amber);margin-right:8px}
.dots{font-size:12px;letter-spacing:2.5px;color:rgba(255,176,32,.9)}
.dots .off{color:var(--line)}
.risk-low{color:var(--teal);font-weight:600}.risk-mid{color:var(--amber);font-weight:600}.risk-high{color:var(--red);font-weight:600}
.mv{font-size:12px;font-weight:650;padding:4px 10px;border-radius:99px;border:1px solid;white-space:nowrap}
.matrix-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.matrix-scroll::-webkit-scrollbar{height:5px}
table.matrix{min-width:720px}

/* recommendation */
.rec{background:linear-gradient(160deg,rgba(255,176,32,.06),rgba(255,106,0,.03) 55%,transparent);border:1px solid rgba(255,176,32,.3);border-radius:20px;padding:30px;margin-top:8px}
.rec h3{font-size:20px;font-weight:750}
.rec .formula{font-family:var(--mono);font-size:13.5px;color:var(--amber);background:rgba(14,18,24,.6);border:1px dashed rgba(255,176,32,.4);border-radius:12px;padding:14px 16px;margin:16px 0;line-height:1.9;overflow-x:auto}
.waves{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-top:18px}
.wave{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.wave .wn{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal)}
.wave h4{font-size:15px;margin:5px 0 8px}
.wave ul{list-style:none}
.wave li{font-size:12.5px;color:var(--mut);padding:4px 0}
.wave li b{color:var(--fg);font-weight:600}

.footer{border-top:1px solid var(--line2);margin-top:60px;padding:26px 0 34px;font-size:12.5px;color:var(--mut)}
.footer b{color:var(--fg)}
</style>
